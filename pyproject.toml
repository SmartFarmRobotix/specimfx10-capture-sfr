[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specimfx10-capture"
version = "0.1.0"
description = "Capture service for the Specim FX10e push-broom hyperspectral camera: Aravis transport, dark/white references, scans to ENVI BIL, HTTP API, watchdog."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "Flask>=3,<4",
    "Flask-Cors>=5,<6",
    "requests>=2.31",
    "pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["specimFX10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
